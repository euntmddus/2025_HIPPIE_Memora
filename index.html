<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <title>Hipple MRI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>

<body>
  <div class="app">

    <div class="toolbar">
      <button class="tool-btn" id="btnSave">저장</button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="btnUpload">MRI 업로드</button>
      <input type="file" id="fileInput" accept=".nii,.nii.gz,.zip" hidden />

      <div style="margin-left:auto" class="muted mono">발행: <span id="issuedAt">—</span></div>
    </div>

    <div class="panes">

      <div class="panel">
        <div class="panel-header">환자 목록</div>
        <div class="panel-body">
          <ul class="patient-list" id="patientList"></ul>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">영상 뷰어</div>
        <div class="panel-body">

          <div class="view-toggle-row">
            <button type="button" class="tool-btn" id="btnView2D">2D</button>
            <button type="button" class="tool-btn" id="btnView3D">3D</button>
          </div>

          <div class="viewer" id="mainViewer">
            <span id="defaultImageText" style="display:block;">No Image</span>
            <img id="viewerImg" style="display:none; max-width:100%; max-height:100%;">
            <div id="mprContainer" style="display:none;">
              <!-- Axial -->
              <div class="three-panel">
                <div id="axialPanel" class="three-subpanel">
                  <canvas id="axialCanvas"></canvas>
                  <div class="view-label">Axial</div>
                  <span class="dir-label dir-top">A</span>
                  <span class="dir-label dir-bottom">P</span>
                  <span class="dir-label dir-left">R</span>
                  <span class="dir-label dir-right">L</span>
                  <div class="info">Axial: <span id="axialInfo">-</span></div>
                </div>

                <!-- Sagittal -->
                <div id="sagittalPanel" class="three-subpanel">
                  <canvas id="sagittalCanvas"></canvas>
                  <div class="dir-label dir-top">S</div>
                  <div class="dir-label dir-bottom">I</div>
                  <div class="dir-label dir-left">A</div>
                  <div class="dir-label dir-right">P</div>
                  <div class="view-label">Sagittal</div>
                  <div class="slice-info" id="sagittalInfo"></div>
                </div>

                <!-- Coronal -->
                <div id="coronalPanel" class="three-subpanel">
                  <canvas id="coronalCanvas"></canvas>
                  <div class="dir-label dir-top">S</div>
                  <div class="dir-label dir-bottom">I</div>
                  <div class="dir-label dir-left">R</div>
                  <div class="dir-label dir-right">L</div>
                  <div class="view-label">Coronal</div>
                  <div class="slice-info" id="coronalInfo"></div>
                </div>

                <div class="three-subpanel"></div>

              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">환자 정보</div>
        <div class="panel-body">
          <div class="kv"><b>환자명</b><span id="ptName">—</span></div>
          <div class="kv"><b>성별/나이</b><span id="ptSexAge">—</span></div>
          <div class="kv"><b>신체 정보</b>
            <ul id="ptVitals" class="vitals-list"></ul>
          </div>

          <div class="section-title">검사 결과 요약</div>
          <textarea id="summaryBox" class="textarea"></textarea>

          <div class="section-title">영상 분석 지표</div>
          <ul id="featureList" class="vitals-list"></ul>
        </div>
      </div>
    </div>

    <div class="log-panel">
      <div class="section-title">작업 로그</div>
      <div class="log-list" id="logList"></div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
